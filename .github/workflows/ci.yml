# Runs the two checks AGENTS.md already requires — pytest and pylint src — on
# a machine that cannot forget to run them.
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # This job used to declare fake DATABASE_URL and JWT_SECRET variables,
    # because configuration was read at import time and pytest failed during
    # COLLECTION without them. Item 17 removed the need: the test values now
    # live in the repository's root conftest.py, where they are visible as test
    # configuration and where they also help anyone running the suite without a
    # .env. Deployment configuration and test configuration stopped sharing a
    # file.

    steps:
      - uses: actions/checkout@v5

      # Python is pinned to the version used locally. A CI on a different minor
      # would be verifying something nobody runs — and this project's local
      # interpreter is 3.9, older than the runner default.
      #
      # `cache: pip` keys on requirements.txt, so an unchanged dependency set
      # is not re-downloaded on every push.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip

      # Python has no direct equivalent of `npm ci`. requirements.txt pins every
      # version with `==`, which gives the same guarantee by a different route:
      # the install is reproducible because the file leaves nothing to resolve.
      #
      # No virtualenv is created. The runner is disposable and nothing else
      # lives on it, so the isolation a venv provides locally is already there.
      # This also sidesteps the stale shebangs in the local .venv, which force
      # `python3 -m pytest` there — on CI the plain commands work.
      # requirements-dev.txt puxa o requirements.txt e acrescenta as
      # ferramentas de teste e lint, que NÃO entram na imagem (Item 30).
      - run: pip install -r requirements-dev.txt

      # --cov reports and never gates. The number is printed for whoever
      # wants to read it; nothing fails on it, because the three most recent
      # defects here all lived on covered lines (Item 26, ADR-008).
      - run: pytest --cov --cov-report=term --cov-report=html

      # The HTML report, uploaded as an artifact. The terminal number tells you
      # THAT something is uncovered; only this tells you WHICH lines, and the
      # per-file pages are where the Item 26 findings actually came from.
      #
      # if: always() so a failing test still leaves the report behind — a run
      # that broke is exactly when you want to look.
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: htmlcov/
          retention-days: 14

      - run: pylint src

  # A second job, not more steps in the first: the mocked suite must stay
  # runnable — and fast — without a database, and the two jobs run in parallel.
  # A failure here is also unambiguous, since nothing in this job is mocked.
  integration:
    runs-on: ubuntu-latest

    # The CI equivalent of docker-compose.yml. Same major version as production
    # (Neon reports 18.4), for the same reason: testing against a different
    # major would hide exactly the differences this suite exists to expose.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: refund_test
          POSTGRES_PASSWORD: refund_test
          POSTGRES_DB: refund_test
        ports:
          - 5433:5432
        # Without a health check the job would start pytest while PostgreSQL is
        # still initialising, and fail on connection rather than on anything
        # real.
        options: >-
          --health-cmd "pg_isready -U refund_test -d refund_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://refund_test:refund_test@localhost:5433/refund_test
      TEST_S3_ENDPOINT: http://localhost:9100

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip

      # requirements-dev.txt puxa o requirements.txt e acrescenta as
      # ferramentas de teste e lint, que NÃO entram na imagem (Item 30).
      - run: pip install -r requirements-dev.txt

      # MinIO is started here rather than as a `services:` entry, and the
      # reason is a real limitation: a service container cannot override the
      # image's command, and this image needs `server /data` to start at all.
      # A services: block with an --entrypoint hack was written first and
      # discarded — it would have started a shell that exits immediately.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=refund_test \
            -e MINIO_ROOT_PASSWORD=refund_test_secret \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9100/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy"; docker logs minio; exit 1

      # -m integration overrides the "not integration" in pytest.ini's addopts,
      # so this job runs exactly the tests the other job skips.
      - run: pytest -m integration

      # The contract file is generated by the integration suite and committed.
      # If a response shape changed and nobody regenerated it, the test above
      # rewrites the file and fails — this makes the drift visible in the log
      # as well, and fails the job if anything else regenerated it silently.
      - name: The contract file must be up to date
        run: git diff --exit-code contract/
