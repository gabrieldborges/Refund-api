# Runs the two checks AGENTS.md already requires — pytest and pylint src — on
# a machine that cannot forget to run them.
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # This job used to declare fake DATABASE_URL and JWT_SECRET variables,
    # because configuration was read at import time and pytest failed during
    # COLLECTION without them. Item 17 removed the need: the test values now
    # live in the repository's root conftest.py, where they are visible as test
    # configuration and where they also help anyone running the suite without a
    # .env. Deployment configuration and test configuration stopped sharing a
    # file.

    steps:
      - uses: actions/checkout@v5

      # Python is pinned to the version used locally. A CI on a different minor
      # would be verifying something nobody runs — and this project's local
      # interpreter is 3.9, older than the runner default.
      #
      # `cache: pip` keys on requirements.txt, so an unchanged dependency set
      # is not re-downloaded on every push.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: pip

      # Python has no direct equivalent of `npm ci`. requirements.txt pins every
      # version with `==`, which gives the same guarantee by a different route:
      # the install is reproducible because the file leaves nothing to resolve.
      #
      # No virtualenv is created. The runner is disposable and nothing else
      # lives on it, so the isolation a venv provides locally is already there.
      # This also sidesteps the stale shebangs in the local .venv, which force
      # `python3 -m pytest` there — on CI the plain commands work.
      - run: pip install -r requirements.txt

      - run: pytest
      - run: pylint src
