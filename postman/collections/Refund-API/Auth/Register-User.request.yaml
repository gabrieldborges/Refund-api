$kind: http-request
method: POST
url: '{{baseUrl}}/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe",
      "email": "john@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has attributes.id", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.nested.property("attributes.id");
      });

      pm.test("Response has attributes.name", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.nested.property("attributes.name");
      });

      pm.test("Response has attributes.email", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.nested.property("attributes.email");
      });

      pm.test("Response has attributes.role", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.nested.property("attributes.role");
      });

      pm.test("attributes.role equals 'standard'", function () {
          var json = pm.response.json();
          pm.expect(json.attributes.role).to.eql("standard");
      });
