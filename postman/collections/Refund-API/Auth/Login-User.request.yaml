$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("access is true", function () {
          var json = pm.response.json();
          pm.expect(json.access).to.be.true;
      });

      pm.test("token exists and is a non-empty string", function () {
          var json = pm.response.json();
          pm.expect(json.token).to.be.a("string").and.to.have.length.above(0);
      });

      pm.collectionVariables.set("authToken", pm.response.json().token);
