$kind: http-request
url: "{{host}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "ana@example.com",
      "password": "senha12345"
    }
scripts:
  - type: afterResponse
    code: |-
      const jsonData = pm.response.json();
      if (jsonData.token) {
          pm.collectionVariables.set("token", jsonData.token);
          console.log("Token salvo na variavel {{token}}");
      }
    language: text/javascript
order: 3000
