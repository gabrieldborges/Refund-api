[pytest]
# Two suites in one command, split by marker.
#
#   pytest                  the 249 mocked tests. No Docker, no database, ~4s.
#   pytest -m integration   the tests that need a real PostgreSQL.
#
# addopts excludes the integration marker by DEFAULT, so the fast suite stays
# the thing that runs constantly and nobody is forced to install Docker to
# work on this project. A -m on the command line is parsed after addopts and
# overrides it, which is what makes the second command above work.
markers =
    integration: needs the throwaway PostgreSQL from docker-compose.yml

addopts = -m "not integration"
